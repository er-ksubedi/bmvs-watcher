name: BMVS slot watcher

on:
  schedule:
    - cron: '*/5 * * * *'      # GitHub's minimum: a new run every 5 minutes
  workflow_dispatch:            # adds a "Run workflow" button for testing
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: normal
        options:
          - normal
          - telegram_only
          - full_test

concurrency:
  group: bmvs-watcher           # never run two at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ---- CHANGE THESE TWO TO SET HOW OFTEN IT CHECKS ----
      # Rule: (CHECKS_PER_RUN - 1) x GAP_SECONDS should be under 200.
      #   1 check            -> about every 5 min
      #   2 checks, 120s gap -> about every 2.5 min
      #   3 checks,  75s gap -> about every 1.5-2 min  (recommended)
      #   4 checks,  60s gap -> about every 1-1.5 min  (fastest allowed)
      CHECKS_PER_RUN: '3'
      GAP_SECONDS: '75'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bmvs-state-${{ github.run_id }}
          restore-keys: bmvs-state-

      - name: Check BMVS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HAP_ID: ${{ secrets.HAP_ID }}
          DOB: ${{ secrets.DOB }}
          MODE: ${{ inputs.mode }}
        run: python bmvs_cloud_check.py

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-view
          path: state/last_view.png
          retention-days: 2
          if-no-files-found: ignore

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: bmvs-state-${{ github.run_id }}
