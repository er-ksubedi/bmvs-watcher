name: BMVS slot watcher

on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes (GitHub's minimum)
  workflow_dispatch:            # adds a "Run workflow" button for testing
    inputs:
      test_mode:
        description: 'Only send a Telegram test message'
        type: boolean
        default: false

concurrency:
  group: bmvs-watcher           # never run two checks at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bmvs-state-${{ github.run_id }}
          restore-keys: bmvs-state-

      - name: Check BMVS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HAP_ID: ${{ secrets.HAP_ID }}
          DOB: ${{ secrets.DOB }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python bmvs_cloud_check.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: bmvs-state-${{ github.run_id }}
