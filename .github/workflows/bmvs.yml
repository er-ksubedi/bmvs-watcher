name: BMVS slot watcher

on:
  schedule:
    - cron: '*/5 * * * *'      # GitHub's minimum: a new run every 5 minutes
  workflow_dispatch:            # adds a "Run workflow" button for testing
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: normal
        options:
          - normal
          - telegram_only
          - full_test

concurrency:
  group: bmvs-watcher           # never run two at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04       # pinned: avoids surprise move to Ubuntu 26
    permissions:    
      actions: write            # lets the script switch off its own schedule
      contents: read

    
    timeout-minutes: 10
    env:
      # ---- CHANGE THESE TWO TO SET HOW OFTEN IT CHECKS ----
      # Each "round" searches every centre in WATCH_CENTRES.
      # With 1 centre:  3 rounds, 75s gap  (about every 1.5-2 min)
      # With 2+ centres: use 2 rounds, 90s gap so each run ends within 5 min
      CHECKS_PER_RUN: '3'
      GAP_SECONDS: '75'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache/restore@v5
        with:
          path: state
          key: bmvs-state-${{ github.run_id }}
          restore-keys: bmvs-state-

      - name: Check BMVS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bmvs_cloud_check.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: last-view
          path: state/*.png
          retention-days: 2
          if-no-files-found: ignore

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state
          key: bmvs-state-${{ github.run_id }}
